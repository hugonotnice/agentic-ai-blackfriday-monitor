services:
  app:
    image: ghcr.io/jez500/pricebuddy:latest
    container_name: bf-pricebuddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    env_file:
      - .env
    environment:
      APP_URL: "${APP_URL:-http://127.0.0.1:8080}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database/database.sqlite
      SCRAPER_BASE_URL: "http://scraper:3000"
      APP_USER_EMAIL: "${APP_USER_EMAIL:-admin@example.com}"
      APP_USER_PASSWORD: "${APP_USER_PASSWORD:-change-me-local-password}"
    volumes:
      - ./storage:/app/storage/database
      - ./logs:/app/storage/logs
      - ./patches/Store.php:/app/app/Models/Store.php:ro
      - ./patches/product-card.blade.php:/app/resources/views/components/product-card.blade.php:ro
      - ./patches/product-badges.blade.php:/app/resources/views/components/product-badges.blade.php:ro
    depends_on:
      - scraper

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: bf-seleniumbase-scraper
    restart: unless-stopped
    ports:
      - "127.0.0.1:3035:3000"
    shm_size: "1gb"
